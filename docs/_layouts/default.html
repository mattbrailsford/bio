<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="https://mattbrailsford.dev/logo-128.png">
    {% seo %}
    <style>
        :root {
            --accent: rgb(74 222 128);
            --accent-hover: rgb(34 197 94);
            --bg: #edf2f7;
            --muted: rgb(203 213 225);
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            background: white;
            color: black;
        }
        @media (min-width: 768px) {
            body {
                align-items: center;
                min-height: 100vh;
                background: var(--bg);
            }
        }
        .card {
            position: relative;
            width: 100%;
            margin: 0 auto;
            background: white;
        }
        @media (min-width: 768px) {
            .card {
                max-width: 32rem;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
                border-radius: 1rem;
            }
        }
        .qr-btn {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0.5rem;
            color: rgb(100 116 139);
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .qr-btn:hover,
        .qr-btn:focus-visible {
            color: var(--accent-hover);
            background: rgba(0, 0, 0, 0.04);
        }
        .qr-btn svg {
            width: 1.25rem;
            height: 1.25rem;
            fill: currentColor;
        }
        .qr-modal {
            border: none;
            border-radius: 1rem;
            padding: 0;
            max-width: min(90vw, 22rem);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .qr-modal::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }
        .qr-modal-body {
            padding: 1.5rem;
            text-align: center;
        }
        .qr-modal-close {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: 2rem;
            height: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            line-height: 1;
            background: transparent;
            border: none;
            border-radius: 0.5rem;
            color: rgb(100 116 139);
            cursor: pointer;
        }
        .qr-modal-close:hover,
        .qr-modal-close:focus-visible {
            background: rgba(0, 0, 0, 0.06);
        }
        .qr-modal h2 {
            margin: 0 0 1rem;
            font-size: 1.125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .qr-output {
            width: 100%;
            max-width: 16rem;
            margin: 0 auto;
            background: white;
            border-radius: 0.5rem;
        }
        .qr-output canvas,
        .qr-output img {
            width: 100%;
            height: auto;
            display: block;
        }
        .qr-url {
            margin: 0.75rem 0 1rem;
            font-size: 0.75rem;
            color: rgb(100 116 139);
            word-break: break-all;
        }
        .qr-download {
            display: inline-block;
            padding: 0.625rem 1.25rem;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .qr-download:hover,
        .qr-download:focus-visible {
            background: var(--accent-hover);
        }
        .avatar-wrap {
            position: relative;
            display: flex;
            height: 8rem;
            width: 100%;
            justify-content: center;
        }
        .avatar {
            position: absolute;
            bottom: -3rem;
            height: 8rem;
            width: 8rem;
        }
        .name {
            margin: 3.5rem 0 0;
            font-size: 1.875rem;
            font-weight: 700;
            text-align: center;
        }
        .subtitle {
            margin: 0;
            text-align: center;
            font-weight: 300;
        }
        .socials {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        .socials a {
            color: black;
            display: inline-flex;
            transition: color 0.15s ease;
        }
        .socials a:hover,
        .socials a:focus-visible {
            color: var(--accent-hover);
        }
        .socials svg {
            width: 2rem;
            height: 2rem;
            fill: currentColor;
        }
        .links {
            margin: 1.25rem;
        }
        .links h3, .links h4 {
            margin-top: 1.25rem;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
        }
        .links ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .links a {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.5rem;
            padding: 1rem;
            border-radius: 2rem;
            background: var(--accent);
            color: black;
            text-decoration: none;
            text-align: center;
            transition: background 0.15s ease;
        }
        .links a:hover, .links a:focus-visible {
            background: var(--accent-hover);
        }
        .credits {
            padding: 1.25rem;
        }
        .credits-label {
            margin: 0;
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
            text-transform: uppercase;
        }
        .credits-name {
            margin: 0;
            font-size: 0.875rem;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>

    <dialog class="qr-modal" aria-labelledby="qr-title" data-qr-modal>
        <div class="qr-modal-body">
            <button type="button" class="qr-modal-close" aria-label="Close" data-qr-close>&times;</button>
            <h2 id="qr-title">QR Code</h2>
            <div class="qr-output" data-qr-output></div>
            <p class="qr-url" data-qr-url></p>
            <button type="button" class="qr-download" data-qr-download>Download PNG</button>
        </div>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        (function () {
            const openBtn = document.querySelector('[data-qr-open]');
            const modal = document.querySelector('[data-qr-modal]');
            const closeBtn = document.querySelector('[data-qr-close]');
            const output = document.querySelector('[data-qr-output]');
            const urlEl = document.querySelector('[data-qr-url]');
            const downloadBtn = document.querySelector('[data-qr-download]');

            let generated = false;

            openBtn.addEventListener('click', () => {
                if (!generated) {
                    const url = window.location.href;
                    new QRCode(output, {
                        text: url,
                        width: 1200,
                        height: 1200,
                        correctLevel: QRCode.CorrectLevel.L
                    });
                    urlEl.textContent = url;
                    generated = true;
                }
                modal.showModal();
            });

            closeBtn.addEventListener('click', () => modal.close());

            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.close();
            });

            downloadBtn.addEventListener('click', () => {
                const canvas = output.querySelector('canvas');
                const img = output.querySelector('img');
                const href = canvas ? canvas.toDataURL('image/png') : img && img.src;
                if (!href) return;
                const link = document.createElement('a');
                link.download = 'qr-code.png';
                link.href = href;
                link.click();
            });
        })();
    </script>
